<svg xmlns="http://www.w3.org/2000/svg" width="1068" height="208" viewBox="0 0 1068 208" role="img" aria-labelledby="t d">
  <title id="t">Vehicle Parking Management System</title>
  <desc id="d">Banner: a car icon, the project title, and the stack Python, Flask, Tailwind CSS and SQLite, over parking-bay lines and a wave.</desc>
  <defs>
